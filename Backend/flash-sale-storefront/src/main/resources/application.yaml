spring:
  application:
    name: flash-sale-storefront

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flash_sale_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true

  flyway:
    enabled: true
    location: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never